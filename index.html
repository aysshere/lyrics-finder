<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lyrics Finder by Ayşe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎧 Şarkı Sözleri Bulucu</h1>
    <p class="subtitle">by <strong>Ayşe</strong></p>

    <form id="lyrics-form">
      <input type="text" id="artist" placeholder="Sanatçı" required />
      <input type="text" id="song" placeholder="Şarkı Adı" required />
      <button type="submit">Sözleri Getir</button>
    </form>

    <div id="lyrics-output"></div>
    <div id="comment-box"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
